<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hawk Jumper</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050b18}
body{display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono',monospace}
#app{position:relative;width:800px;height:500px;max-width:100vw}
canvas{display:none;width:100%;height:100%;touch-action:none;cursor:pointer}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:linear-gradient(180deg,#050b18 0%,#0a1a30 60%,#0d2040 100%);
  color:#fff;padding:20px}
.screen.hidden{display:none}
h1.logo{font-family:'Orbitron',sans-serif;font-size:52px;font-weight:900;letter-spacing:6px;
  color:#3ddc84;text-shadow:0 0 30px #2ecc71,0 0 60px rgba(46,204,113,.33);margin:0;line-height:1}
h1.logo span{color:#fff}
.tag{color:#7dffb0;font-size:13px;letter-spacing:3px;margin:8px 0 24px;opacity:.8}
input{width:100%;max-width:320px;background:rgba(46,204,113,.08);border:2px solid #2ecc71;
  border-radius:8px;padding:12px 16px;font-size:17px;color:#fff;font-family:inherit;
  outline:none;letter-spacing:1px;margin-bottom:6px}
input::placeholder{color:#3a7a55}
input:focus{border-color:#4fffaa;box-shadow:0 0 16px rgba(63,255,170,.25)}
.err{color:#ff5555;font-size:12px;min-height:18px;margin-bottom:10px;text-align:center}
.btn{width:100%;max-width:320px;border-radius:8px;border:2px solid #4fffaa;padding:13px 28px;
  font-family:'Orbitron',sans-serif;font-weight:700;font-size:14px;cursor:pointer;
  letter-spacing:2px;text-transform:uppercase;transition:all .15s;margin-bottom:10px}
.bp{background:linear-gradient(135deg,#1a7a3a,#2ecc71);color:#fff;box-shadow:0 0 20px rgba(46,204,113,.4)}
.bp:hover{box-shadow:0 0 32px rgba(63,255,170,.7);transform:translateY(-1px)}
.bs{background:rgba(46,204,113,.1);color:#4fffaa;border-color:rgba(46,204,113,.53)}
.bx{background:linear-gradient(135deg,#0d6fd1,#1d9bf0);color:#fff;border-color:#4aaeff}
.bg2{background:transparent;color:#446655;border-color:#223322;font-size:12px}
.sbox{background:rgba(46,204,113,.08);border:2px solid #2ecc71;border-radius:14px;
  padding:20px 48px;margin-bottom:20px;text-align:center}
.sl{font-size:12px;color:#7dffb0;letter-spacing:3px;margin-bottom:4px}
.sn{font-family:'Orbitron',sans-serif;font-size:52px;font-weight:900;color:#4fffaa;text-shadow:0 0 24px #2ecc71}
.lbr{display:flex;align-items:center;gap:12px;padding:11px 18px;border-radius:8px;
  border:1px solid rgba(46,204,113,.27);margin-bottom:8px;font-size:14px}
.lbr.gd{border-color:#ffd700;background:rgba(255,215,0,.07)}
#lb-list{width:100%;max-width:440px;max-height:300px;overflow-y:auto}
.sbg{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.st{position:absolute;border-radius:50%;background:#fff;animation:tw 3s infinite alternate}
.screen>*:not(.sbg){position:relative;z-index:1}
.nb{color:#ffd700;font-size:12px;letter-spacing:2px;margin-top:-12px;margin-bottom:12px}
.onl{position:absolute;top:8px;right:12px;font-size:11px;letter-spacing:1px;opacity:.7}
.onl.on{color:#4fffaa} .onl.off{color:#ff5555}
#s-go{padding:15px 10px 20px;text-align:center}
#s-go .sbox{padding:10px 24px;margin-bottom:12px;max-width:280px;margin-left:auto;margin-right:auto}
#s-go .sn{font-size:38px}
#s-go .btn{max-width:260px!important;padding:10px 20px;font-size:12.5px;margin-bottom:6px;min-height:44px}
#s-go>*:not(.sbg){margin-left:auto;margin-right:auto}
@keyframes tw{from{opacity:.15}to{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <div class="screen" id="s-login">
    <div class="sbg"></div>
    <div style="font-size:68px;margin-bottom:8px;filter:drop-shadow(0 0 18px #2ecc71)">&#129413;</div>
    <h1 class="logo">HAWK<span> JUMPER</span></h1>
    <p class="tag">Jump &bull; Collect &bull; Survive</p>
    <input id="ni" placeholder="Enter your nickname..." maxlength="20" autocomplete="off"/>
    <div class="err" id="ne"></div>
    <button class="btn bp" id="playBtn">&#9658; PLAY</button>
    <button class="btn bs" id="lbBtn">&#127942; LEADERBOARD</button>
  </div>

  <div class="screen hidden" id="s-lb">
    <div class="sbg"></div>
    <span class="onl" id="onl-badge">&#9679; ONLINE</span>
    <h2 style="font-family:Orbitron,sans-serif;font-size:26px;color:#4fffaa;letter-spacing:4px;text-shadow:0 0 20px #2ecc71;margin-bottom:22px">&#127942; LEADERBOARD</h2>
    <div id="lb-list"></div>
    <p id="lb-empty" style="color:#446655;font-size:13px;display:none;margin-bottom:20px">No records yet. Be the first!</p>
    <button class="btn bs" id="lbBack" style="max-width:200px;margin-top:14px">&larr; BACK</button>
  </div>

  <canvas id="gc"></canvas>

  <div class="screen hidden" id="s-go">
    <div class="sbg"></div>
    <div style="font-size:52px;margin-bottom:10px">&#128128;</div>
    <h2 style="font-family:Orbitron,sans-serif;font-size:28px;color:#ff4444;letter-spacing:3px;margin-bottom:6px">GAME OVER</h2>
    <p style="color:#aaffcc;font-size:13px;letter-spacing:2px;margin-bottom:14px" id="go-n"></p>
    <div class="sbox">
      <div class="sl">SCORE</div>
      <div class="sn" id="go-s">0</div>
      <div style="color:#446655;font-size:11px;margin-top:4px;letter-spacing:2px">POINTS</div>
    </div>
    <p class="nb hidden" id="go-b">&#127942; NEW PERSONAL BEST!</p>
    <button class="btn bp" id="retryBtn">&#128260; PLAY AGAIN</button>
    <a id="twa" href="#" target="_blank" style="width:100%;max-width:260px;text-decoration:none">
      <button class="btn bx" style="width:100%">&#120143; SHARE ON X</button>
    </a>
    <button class="btn bs" id="goLb">&#127942; LEADERBOARD</button>
    <button class="btn bg2" id="goMenu">&larr; MENU</button>
  </div>
</div>

// Статус online/offline
function setOnlineBadge(online) {
  var b = document.getElementById('onl-badge');
  if (!b) return;
  if (online) { b.textContent = '\u25CF ONLINE'; b.className = 'onl on'; }
  else        { b.textContent = '\u25CF OFFLINE'; b.className = 'onl off'; }
}

// ─── LEADERBOARD ─────────────────────────────────
var LS = 'hj9';
function getLBLocal(){ try{return JSON.parse(localStorage.getItem(LS)||'[]');}catch(e){return[];} }
function saveLBLocal(lb){ localStorage.setItem(LS, JSON.stringify(lb)); }

// Зберегти рахунок (Firebase + localStorage)
function addScore(name, score) {
  // Локально
  var lb = getLBLocal();
  var idx = lb.findIndex(function(e){ return e.name.toLowerCase()===name.toLowerCase(); });
  var best = false;
  var d = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
  if(idx===-1){ lb.push({name:name,score:score,date:d}); best=true; }
  else if(score>lb[idx].score){ lb[idx]={name:name,score:score,date:d}; best=true; }
  lb.sort(function(a,b){return b.score-a.score;}); saveLBLocal(lb.slice(0,10));

  // Firebase
  if (firebaseReady && db) {
    var key = name.toLowerCase().replace(/[^a-z0-9]/g, '_').substring(0, 30);
    var ref = db.ref('leaderboard/' + key);
    ref.once('value').then(function(snap) {
      var existing = snap.val();
      if (!existing || score > (existing.score || 0)) {
        ref.set({ name: name, score: score, date: d });
      }
    }).catch(function(){});
  }
  return best;
}

// Показати лідерборд (Firebase → fallback localStorage)
function renderLB() {
  var list = document.getElementById('lb-list');
  var emp  = document.getElementById('lb-empty');
  list.innerHTML = '<div style="color:#4fffaa;text-align:center;padding:20px;letter-spacing:2px">&#8987; LOADING...</div>';
  emp.style.display = 'none';

  if (firebaseReady && db) {
    db.ref('leaderboard').orderByChild('score').limitToLast(10)
      .once('value').then(function(snap) {
        var lb = [];
        snap.forEach(function(child) { lb.push(child.val()); });
        lb.sort(function(a,b){ return b.score-a.score; });
        setOnlineBadge(true);
        renderLBRows(lb, list, emp);
      }).catch(function() {
        setOnlineBadge(false);
        renderLBRows(getLBLocal(), list, emp);
      });
  } else {
    setOnlineBadge(false);
    renderLBRows(getLBLocal(), list, emp);
  }
}

function renderLBRows(lb, list, emp) {
  list.innerHTML = '';
  if (!lb.length) { emp.style.display='block'; return; }
  emp.style.display = 'none';
  var md = ['&#129351;','&#129352;','&#129353;'];
  lb.forEach(function(e,i){
    var r = document.createElement('div');
    r.className = 'lbr' + (i===0?' gd':'');
    r.innerHTML = '<span style="width:36px;text-align:center">'+(md[i]||'#'+(i+1))+'</span>'+
      '<span style="flex:1;color:#cceedd">'+e.name+'</span>'+
      '<span style="color:#4fffaa;font-family:Orbitron,monospace;font-size:13px;font-weight:700">'+e.score+'</span>'+
      '<span style="color:#334433;font-size:11px;width:70px;text-align:right">'+(e.date||'')+'</span>';
    list.appendChild(r);
  });
}

function stripBlack(img) {
  var c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
  var x=c.getContext('2d'); x.drawImage(img,0,0);
  var id=x.getImageData(0,0,c.width,c.height), d=id.data;
  for(var i=0;i<d.length;i+=4){
    var br=Math.max(d[i],d[i+1],d[i+2]);
    if(br<50){d[i+3]=0;} else if(br<130){d[i+3]=Math.round(((br-50)/80)*255);}
  }
  x.putImageData(id,0,0); return c;
}

var HAWK=null,COIN=null,HAWK_BODY=null,HAWK_WINGS=null,READY=false;

function bakeHawkParts(){
  if(!HAWK||HAWK.width===0)return;
  var W=HAWK.width,H=HAWK.height;
  var wingsH=Math.round(H*0.60), bodyY=Math.round(H*0.45), bodyH=H-bodyY;
  HAWK_WINGS=document.createElement('canvas'); HAWK_WINGS.width=W; HAWK_WINGS.height=wingsH;
  HAWK_WINGS.getContext('2d').drawImage(HAWK,0,0,W,wingsH,0,0,W,wingsH);
  HAWK_BODY=document.createElement('canvas'); HAWK_BODY.width=W; HAWK_BODY.height=bodyH;
  HAWK_BODY.getContext('2d').drawImage(HAWK,0,bodyY,W,bodyH,0,0,W,bodyH);
}

function loadAssets(cb){
  var n=0;
  function done(){ if(++n===2){READY=true;bakeHawkParts();if(cb)cb();} }
  var hi=new Image(); hi.onload=function(){HAWK=stripBlack(hi);done();}; hi.onerror=done;
  hi.src="data:image/png;base64,"+HAWK_B64;
  var ci=new Image(); ci.onload=function(){COIN=stripBlack(ci);done();}; ci.onerror=done;
  ci.src="data:image/png;base64,"+COIN_B64;
}
loadAssets();

var audioCtx = new (window.AudioContext||window.webkitAudioContext)();
var bgMusic = new Audio('https://soundimage.org/wp-content/uploads/2020/04/Pixel-Runner.mp3');
bgMusic.loop=true; bgMusic.volume=0.25;

function playJump(){
  var osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.type='sine'; osc.frequency.setValueAtTime(420,audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(120,audioCtx.currentTime+0.22);
  gain.gain.value=0.35; gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.25);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+0.3);
}
function playCoin(){
  var osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.type='triangle'; osc.frequency.setValueAtTime(880,audioCtx.currentTime);
  osc.frequency.setValueAtTime(1320,audioCtx.currentTime+0.05);
  osc.frequency.setValueAtTime(1760,audioCtx.currentTime+0.12);
  gain.gain.value=0.4; gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.35);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+0.4);
}
function playGameOver(){
  var now=audioCtx.currentTime;
  var boom=audioCtx.createOscillator(), gainBoom=audioCtx.createGain();
  boom.type='sine'; boom.frequency.value=65; gainBoom.gain.value=0.65;
  gainBoom.gain.exponentialRampToValueAtTime(0.001,now+1.8);
  var melody=audioCtx.createOscillator(), gainMelody=audioCtx.createGain();
  melody.type='sawtooth'; melody.frequency.setValueAtTime(420,now);
  melody.frequency.exponentialRampToValueAtTime(80,now+1.4);
  gainMelody.gain.value=0.25; gainMelody.gain.exponentialRampToValueAtTime(0.001,now+1.6);
  var noise=audioCtx.createBufferSource();
  var buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.6,audioCtx.sampleRate);
  var data=buf.getChannelData(0); for(var i=0;i<buf.length;i++) data[i]=Math.random()*2-1;
  noise.buffer=buf;
  var noiseGain=audioCtx.createGain(); noiseGain.gain.value=0.12;
  noiseGain.gain.exponentialRampToValueAtTime(0.001,now+1.9);
  var filter=audioCtx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=800;
  boom.connect(gainBoom); melody.connect(gainMelody); noise.connect(noiseGain);
  noiseGain.connect(filter); filter.connect(audioCtx.destination);
  gainBoom.connect(audioCtx.destination); gainMelody.connect(audioCtx.destination);
  boom.start(now); melody.start(now); noise.start(now+1.1);
  boom.stop(now+2); melody.stop(now+1.7); noise.stop(now+2);
}

var GW=800,GH=500,GRAV=0.60,JF=-13.5,PW=68,PH=68,BASE_SPD=3.4,MAX_SPD=16;

function drawHawk(ctx,px,py,wingLift,tilt){
  if(!HAWK_BODY||!HAWK_WINGS){
    if(HAWK){ctx.save();ctx.translate(px+PW/2,py+PH/2);ctx.rotate(tilt);ctx.drawImage(HAWK,-PW/2,-PH/2,PW,PH);ctx.restore();}
    return;
  }
  var bodyFrac=HAWK_BODY.height/HAWK.height, wingsFrac=HAWK_WINGS.height/HAWK.height;
  var dBodyH=PH*bodyFrac, dWingsH=PH*wingsFrac, bodyY0=PH*0.45-PH/2;
  ctx.save(); ctx.translate(px+PW/2,py+PH/2); ctx.rotate(tilt);
  ctx.drawImage(HAWK_BODY,-PW/2,bodyY0,PW,dBodyH);
  ctx.drawImage(HAWK_WINGS,-PW/2,-PH/2+wingLift,PW,dWingsH);
  ctx.restore();
}

function mkPlat(x,y,w){return{x:x,y:y,w:w,h:16};}
function calcGap(s){return 65+(s-BASE_SPD)*15;}
function calcW(s){return Math.max(55,92-(s-BASE_SPD)*3)+Math.random()*Math.max(30,100-(s-BASE_SPD)*3);}
function genWorld(s){
  var ps=[mkPlat(0,GH-115,250)],lx=250;
  for(var i=0;i<14;i++){var x=lx+calcGap(s)+Math.random()*50,y=(GH-200)+Math.random()*130,w=calcW(s);ps.push(mkPlat(x,y,w));lx=x+w;}
  return ps;
}
function spawnCoins(p,s){
  var n=Math.max(1,Math.floor(Math.random()*3)+1-Math.floor(s/8)),arr=[];
  for(var i=0;i<n;i++) arr.push({x:p.x+(i+.5)*(p.w/(n+1)),y:p.y-46,done:false,ph:Math.random()*Math.PI*2});
  return arr;
}
function burst(gs,x,y,col){
  for(var i=0;i<8;i++) gs.pts.push({x:x,y:y,vx:(Math.random()-.5)*6,vy:Math.random()*-5-1,life:1,r:Math.random()*5+2,col:col||'#4fffaa'});
}

var raf=null,gs=null;
function startGame(){
  if(raf){cancelAnimationFrame(raf);raf=null;}
  if(HAWK&&!HAWK_BODY) bakeHawkParts();
  var cv=document.getElementById('gc'); cv.width=GW; cv.height=GH;
  var ctx=cv.getContext('2d');
  var plats=genWorld(BASE_SPD),coins=[];
  plats.slice(1).forEach(function(p){if(Math.random()>.25)coins=coins.concat(spawnCoins(p,BASE_SPD));});
  gs={p:{x:80,y:270,vy:0,jumps:2,dead:false,ground:false},
      plats:plats,coins:coins,pts:[],score:0,speed:BASE_SPD,frame:0,
      wingLift:0,wingTarget:0,wingOscAngle:0,flapActive:false};

  function jump(){
    playJump();
    if(bgMusic&&bgMusic.paused) bgMusic.play().catch(function(){});
    if(!gs||gs.p.dead)return;
    if(gs.p.jumps>0){
      gs.p.vy=JF; gs.p.jumps--;
      gs.wingLift=-28; gs.flapActive=true;
      burst(gs,gs.p.x+PW/2,gs.p.y+PH);
    }
  }
  function onKey(e){if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump();}}
  function onTap(e){e.preventDefault();jump();}
  window.addEventListener('keydown',onKey);
  cv.addEventListener('touchstart',onTap,{passive:false});
  cv.addEventListener('click',jump);
  gs.clean=function(){window.removeEventListener('keydown',onKey);cv.removeEventListener('touchstart',onTap);cv.removeEventListener('click',jump);};
  function loop(){tick();draw(ctx);if(gs.p.dead){gs.clean();endGame(gs.score);return;}raf=requestAnimationFrame(loop);}
  raf=requestAnimationFrame(loop);
}

function tick(){
  gs.frame++;
  if(gs.frame%180===0) gs.speed=Math.min(gs.speed+0.35,MAX_SPD);
  if(gs.flapActive){
    gs.wingLift+=(0-gs.wingLift)*0.18;
    if(Math.abs(gs.wingLift)<0.5){gs.wingLift=0;gs.flapActive=false;}
  } else {
    gs.wingOscAngle+=gs.p.ground?0.05:0.09;
    gs.wingTarget=Math.sin(gs.wingOscAngle)*(gs.p.ground?4:7);
    gs.wingLift+=(gs.wingTarget-gs.wingLift)*0.2;
  }
  var p=gs.p; p.vy+=GRAV; p.y+=p.vy; p.ground=false;
  for(var i=0;i<gs.plats.length;i++){
    var pl=gs.plats[i],pf=(p.y-p.vy)+PH;
    if(p.x+PW-8>pl.x&&p.x+8<pl.x+pl.w&&p.y+PH>=pl.y&&pf<=pl.y+8&&p.vy>=0){
      p.y=pl.y-PH;p.vy=0;p.ground=true;p.jumps=2;
    }
  }
  for(var i=0;i<gs.plats.length;i++) gs.plats[i].x-=gs.speed;
  for(var i=0;i<gs.coins.length;i++)  gs.coins[i].x-=gs.speed;
  gs.plats=gs.plats.filter(function(pl){return pl.x+pl.w>-20;});
  gs.coins=gs.coins.filter(function(c){return c.x+32>-20&&!c.done;});
  while(gs.plats.length<14){
    var last=gs.plats[gs.plats.length-1];
    var x=last.x+last.w+calcGap(gs.speed)+Math.random()*50,y=(GH-200)+Math.random()*140,w=calcW(gs.speed);
    var np=mkPlat(x,y,w); gs.plats.push(np);
    if(Math.random()>.25) gs.coins=gs.coins.concat(spawnCoins(np,gs.speed));
  }
  for(var i=0;i<gs.coins.length;i++){
    var c=gs.coins[i];
    if(!c.done&&p.x+PW-8>c.x&&p.x+8<c.x+32&&p.y+PH-4>c.y&&p.y+4<c.y+32){
      c.done=true; var pts=Math.round(100*(gs.speed/BASE_SPD)); gs.score+=pts;
      burst(gs,c.x+16,c.y+16,'#ffe566'); playCoin();
      gs.pts.push({x:c.x+16,y:c.y-4,vx:0,vy:-2.5,life:1.8,r:0,col:'#ffe566',text:'+'+pts});
    }
  }
  for(var i=0;i<gs.pts.length;i++){var pt=gs.pts[i];pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.1;pt.life-=0.04;}
  gs.pts=gs.pts.filter(function(pt){return pt.life>0;});
  if(p.y>GH+100) p.dead=true;
}

function draw(ctx){
  ctx.clearRect(0,0,GW,GH);
  var sky=ctx.createLinearGradient(0,0,0,GH);
  sky.addColorStop(0,'#030c1a');sky.addColorStop(.7,'#0a1d35');sky.addColorStop(1,'#0f2242');
  ctx.fillStyle=sky; ctx.fillRect(0,0,GW,GH);
  for(var i=0;i<55;i++){
    var sx=((i*197+gs.frame*.22)%GW+GW)%GW,sy=(i*113)%(GH*.52);
    ctx.fillStyle='rgba(255,255,255,'+(0.25+0.75*Math.abs(Math.sin(gs.frame*.015+i)))+')';
    ctx.beginPath();ctx.arc(sx,sy,i%4===0?1.4:.6,0,Math.PI*2);ctx.fill();
  }
  for(var i=0;i<gs.plats.length;i++){
    var pl=gs.plats[i]; ctx.save(); ctx.shadowColor='#2ecc71'; ctx.shadowBlur=12;
    var g=ctx.createLinearGradient(pl.x,pl.y,pl.x,pl.y+pl.h);
    g.addColorStop(0,'#3ddc84');g.addColorStop(1,'#1a9950');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(pl.x,pl.y,pl.w,pl.h,5);ctx.fill();
    ctx.strokeStyle='rgba(100,255,160,.4)';ctx.lineWidth=1;ctx.stroke();ctx.restore();
  }
  for(var i=0;i<gs.coins.length;i++){
    var c=gs.coins[i];if(c.done)continue;
    var bob=Math.sin(gs.frame*.08+c.ph)*4; ctx.save(); ctx.shadowColor='#ffe566'; ctx.shadowBlur=14;
    if(COIN&&COIN.width>0){ctx.drawImage(COIN,c.x,c.y+bob,32,32);}
    else{ctx.fillStyle='#ffe566';ctx.beginPath();ctx.roundRect(c.x,c.y+bob,32,32,4);ctx.fill();}
    ctx.restore();
  }
  for(var i=0;i<gs.pts.length;i++){
    var pt=gs.pts[i]; ctx.save(); ctx.globalAlpha=Math.min(pt.life,1);
    if(pt.text){ctx.font='bold 15px Orbitron,monospace';ctx.textAlign='center';ctx.fillStyle=pt.col;ctx.shadowColor=pt.col;ctx.shadowBlur=8;ctx.fillText(pt.text,pt.x,pt.y);}
    else{ctx.fillStyle=pt.col;ctx.shadowColor=pt.col;ctx.shadowBlur=6;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
  var tilt=Math.max(-.28,Math.min(.28,gs.p.vy*.022));
  drawHawk(ctx,gs.p.x,gs.p.y,gs.wingLift,tilt);
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.beginPath();ctx.roundRect(10,10,255,84,10);ctx.fill();
  ctx.fillStyle='#4fffaa';ctx.font='bold 26px Orbitron,monospace';ctx.fillText(gs.score+' pts',22,46);
  ctx.fillStyle='#7dffb0';ctx.font='12px "Share Tech Mono",monospace';ctx.fillText('Speed: '+gs.speed.toFixed(1)+'x',22,66);
  ctx.fillStyle='#ffe566';ctx.font='bold 12px "Share Tech Mono",monospace';ctx.fillText('Box: +'+Math.round(100*(gs.speed/BASE_SPD))+' pts',22,84);
  ctx.restore();
  if(gs.frame<140){
    ctx.save();ctx.globalAlpha=1-gs.frame/140;
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.beginPath();ctx.roundRect(GW/2-155,GH-66,310,38,10);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='13px "Share Tech Mono",monospace';ctx.textAlign='center';
    ctx.fillText('SPACE / TAP to jump  \u2022  Double jump!',GW/2,GH-41);ctx.restore();
  }
}

function endGame(score){
  if(bgMusic){bgMusic.pause();bgMusic.currentTime=0;}
  playGameOver();
  var isBest=addScore(username,score);
  document.getElementById('go-n').textContent=username;
  document.getElementById('go-s').textContent=score;
  document.getElementById('go-b').classList.toggle('hidden',!isBest);
  var msg='\uD83E\uDD85 I scored '+score+' points in Hawk Jumper, created special for @RAFA_AI! Can you beat me? Thanks for @bukhlak88.';
  document.getElementById('twa').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(msg);
  show('s-go');
}
</script>
